name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（例如 1.2.3 或 v1.2.3）
        required: true
        type: string
      publish_docker:
        description: 构建并上传 amd64/arm64 Docker 镜像
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      docker_image: ${{ steps.docker-image.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::版本号必须是 SemVer，例如 1.2.3、v1.2.3 或 1.2.3-rc.1"
            exit 1
          fi

          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::标签 ${tag} 已存在"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Normalize Docker image name
        id: docker-image
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        shell: bash
        run: |
          set -euo pipefail
          image="${DOCKERHUB_IMAGE,,}"
          if [[ "$image" != "$DOCKERHUB_IMAGE" ]]; then
            echo "::notice::Docker image name was normalized to lowercase: ${image}"
          fi
          echo "name=${image}" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded frontend
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}

      - name: Build mNest
        env:
          MNEST_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --locked --release

      - name: Package release archive
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          archive="mNest-${VERSION}-${PLATFORM}"
          mkdir -p "dist/${archive}"
          install -m 0755 target/release/mNest "dist/${archive}/mNest"
          cp config.example.yaml LICENSE README.md "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "$archive"
          cd dist
          sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: mNest-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: ${{ always() && needs.prepare.result == 'success' && needs.build-binaries.result == 'success' && (!inputs.publish_docker || needs.publish-docker.result == 'success') }}
    needs:
      - prepare
      - build-binaries
      - publish-docker
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: mNest-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: mNest ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  build-docker:
    name: Build Docker ${{ matrix.arch }}
    if: ${{ inputs.publish_docker }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_IMAGE: ${{ needs.prepare.outputs.docker_image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_IMAGE" ]]; then
            echo "::error::请配置 Repository variable: DOCKERHUB_IMAGE，例如 username/mnest"
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::请配置 Repository secrets: DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Detect Docker Hub build cache
        id: registry-cache
        env:
          CACHE_REF: ${{ needs.prepare.outputs.docker_image }}:buildcache-${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$CACHE_REF" >/dev/null 2>&1; then
            echo "source=type=registry,ref=${CACHE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub cache ${CACHE_REF} does not exist yet; building without it"
            echo "source=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.arch }} image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.docker_image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            ALPINE_MIRROR=${{ vars.ALPINE_MIRROR || 'https://dl-cdn.alpinelinux.org/alpine' }}
          cache-from: |
            ${{ steps.registry-cache.outputs.source }}
            type=gha,scope=mnest-${{ matrix.arch }}
          cache-to: |
            type=registry,ref=${{ needs.prepare.outputs.docker_image }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
            type=gha,scope=mnest-${{ matrix.arch }},mode=max

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest: ${DIGEST}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-docker:
    name: Publish multi-architecture Docker image
    if: ${{ inputs.publish_docker }}
    needs:
      - prepare
      - build-docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.docker_image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=mNest
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Create and verify multi-architecture manifest
        env:
          DOCKERHUB_IMAGE: ${{ needs.prepare.outputs.docker_image }}
          DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          digest_files=("$RUNNER_TEMP"/digests/*)
          if [[ ${#digest_files[@]} -ne 2 ]]; then
            echo "::error::Expected two platform digests, found ${#digest_files[@]}"
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$DOCKER_TAGS"

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "$digest_file")"
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid digest file: ${digest}"
              exit 1
            fi
            sources+=("${DOCKERHUB_IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"
